# DL/T698 协议示例字典（仅用于验证 protocol 维度的隔离性，非真实协议内容）
#
# 故意用跟 csg1209022/test_di.yaml 里 00080000 一样的 DI 号，但给出完全不同
# 的定义——这是用来证明"同一个 DI 号在不同协议下互不干扰、互不误退回"的
# 反例测试数据，不代表 DL/T698 的真实字段定义。

data_items:
  - id: "00080000"
    name: 电表运行状态（DL/T698定义，与csg1209022同DI号但完全不同协议/含义）
    length: 1
    type: bcd
    enum:
      "00": 正常
      "01": 故障

  # 这条不写 region，落在 dlt698 协议自己的 default 桶里；用来验证
  # "GD 在 dlt698 协议下没有专有定义时，回退的是 dlt698 自己的通用定义，
  # 而不是误退回到 csg1209022 协议"