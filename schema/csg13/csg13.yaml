  - id: "E1800060"
    name: "终端是否支持分钟级采集"
    protocol: "csg13"
    region: ["南网"]
    length: 1
    type: bcd
    enum:
      "00": 不支持
      "01": 支持
  - id: "E1800061"
    name: "分钟级采集本轮用时"
    protocol: "csg13"
    region: ["南网"]
    length: 2
    type: bcd
    unit: "分"
  - id: "E0001400"
    name: "APP控制指令"
    protocol: "csg13"
    region: ["南网"]
    fields:
      - name: "APP数量"
        length: 1
        type: bcd
        ref_id: app_count
      - name: "APP控制信息"
        type: repeat
        count_ref: app_count
        element:
          name: "第{index}组APP控制信息"
          fields:
            - name: APP名称
              length: 24
              type: ascii
            - name: 控制类型
              length: 1
              type: bcd
              enum:
                "00": "安装"
                "01": "启动"
                "02": "停止"
                "03": "卸载"
            

  - id: "E1006000"
    name: "相位信息"
    protocol: "csg13"
    region: ["南网"]
    length: 4
    fields:
      - name: "相序相性信息"
        length: 1
        type: bitfield
        bits:
          - range: [0, 2]
            name: "相线标识"
            enum:
              "100": "C相"
              "010": "B相"
              "001": "A相"
              "110": "A相"
              "101": "B相"
              "011": "C相"
              "111": "正常"
          - range: [3, 4]
            name: "相线特征"
            enum:
              "00": "支持相线识别"
              "01": "不支持相线识别"
              "02": "相线不确定"
          - range: [5, 7]
            name: "相序特征"
            enum:
              "000": "三相表ABC（单相/三相正常相序）"
              "001": "三相表ACB（逆相序）"
              "010": "三相表BAC（逆相序）"
              "011": "三相表BCA（逆相序）"
              "100": "三相表CAB（逆相序）"
              "101": "三相表CBA（逆相序）"
              "110": "三相表/单相表零火反接（逆相序）"
              "111": "保留"
      - name: "电表及规约类型"
        length: 1
        type: bitfield
        bits:
          - range: [0, 4]
            name: "规约类型"
            enum:
              "0000": "未知规约"
              "0001": "DLT/645-1997"
              "0002": "DLT/645-2007"
              "0003": "CJ/T188"
          - range: [5, 5]
            name: "保留"
            enum:
              "0": "默认"
          - range: [6, 7]
            name: "电表类型"
            enum:
              "01": "单相"
              "02": "三相表"
      - name: "保留"
        length: 2
        type: bcd
  - id: "E1800022"
    name: "拓扑关系信息"
    protocol: "csg13"
    region: ["南网"]
    length: 36
    fields:
      - name: "拓扑关系文件名"
        length: 32
        type: hex
      - name: "摘要信息"
        length: 2
        type: hex
  - id: "E1006001"
    name: "台区信息"
    protocol: "csg13"
    region: ["南网"]
    length: 1
    type: bcd
  - id: "E1006002"
    name: "应属台区主节点MAC地址"
    protocol: "csg13"
    region: ["南网"]
    length: 6
    type: bcd
  - id: "E1006004"
    name: "网络拓扑信息"
    protocol: "csg13"
    region: ["南网"]
    fields:
      - name: "节点总数量"
        length: 2
        type: bin
        endian: little
      - name: "节点起始序号"
        length: 2
        type: bin
        endian: little
      - name: "本次应答的节点数量"
        length: 1
        type: bin
        ref_id: resp_count
      - name: "节点网络拓扑信息"
        type: repeat
        count_ref: resp_count
        element:
          name: "节点{index}网络拓扑信息"
          fields:
            - name: "节点地址"
              length: 6
              type: hex
            - name: "网络拓扑信息"
              length: 13
              type: hex

  - id: "E1006005"
    name: "多网络信息"
    protocol: "csg13"
    region: ["南网"]
    fields:
      - name: "多网络节点总数量"
        length: 1
        type: bin
        ref_id: node_count
      - name: "本节点网络标识号"
        length: 1
        type: bin
      - name: "本节点主节点地址"
        length: 6
        type: hex
      - name: "邻居节点网络标识号"
        type: repeat
        count_ref: node_count
        element:
          name: "邻居节点{index}网络标识号"
          length: 1
          type: bin

  - id: "E1006006"
    name: "白名单生效信息"
    protocol: "csg13"
    region: ["南网"]
    length: 2
    fields:
      - name: "白名单开关"
        length: 1
        type: bin
        enum:
          "00": 关闭
          "01": 开启
      - name: "白名单生效范围"
        length: 1
        type: bin
        enum:
          "00": 表档案
          "01": 厂家自定义
          "02": 表档案和厂家自定义

  - id: "E1006007"
    name: "节点运行时长"
    protocol: "csg13"
    region: ["南网"]
    length: 4
    type: bin
    endian: little
    unit: "秒"
  - id: "E1006008"
    name: "从节点入网被拒信息"
    protocol: "csg13"
    region: ["南网"]
    fields:
      - name: "从节点数量"
        length: 2
        type: bin
        endian: little
      - name: "本次应答节点数量"
        length: 1
        type: bin
        ref_id: node_count
      - name: "从节点入网被拒信息"
        type: repeat
        count_ref: node_count
        element:
          name: "从节点{index}地址"
          type: hex
          length: 6

  - id: "E1006009"
    name: "周边节点信道信息"
    protocol: "csg13"
    region: ["南网"]
    fields:
      - name: "周边节点总数量"
        length: 2
        type: bin
        endian: little
      - name: "本次应答节点数量"
        length: 1
        type: bin
        ref_id: node_count
      - name: "周边节点信道信息"
        type: repeat
        count_ref: node_count
        element:
          name: "周边节点{index}信息"
          type: hex
          length: 16

  - id: "E1006010"
    name: "节点自检信息"
    protocol: "csg13"
    region: ["南网"]
    length: 4
    fields:
      - name: "过零自检结果"
        length: 1
        type: bin
      - name: "串口/485不通状态"
        length: 1
        type: bin
        enum:
          "00": 正常
          "01": 历史上出现过不通现象
          "02": 目前不通
      - name: "上次离网原因"
        length: 1
        type: bin
        enum:
          "00": 未离网
          "01": 组网序列号发生变化
          "02": 2个路由周期收不到信标帧
          "03": 与代理节点连续四个路由周期的通信成功率都是0</
          "04": 站点所在层级超过15级
          "05": 收到离线指示
      - name: "复位原因"
        length: 1
        type: bin
        enum:
          "00": 掉电复位
          "01": 复位引脚复位
          "02": 升级完成复位
          "03": CCO控制从节点重启

  - id: "E1006011"
    name: "应用层报文信息"
    protocol: "csg13"
    region: ["南网"]
    fields:
      - name: "报文总数量"
        length: 2
        type: bin
        endian: little
      - name: "本次上报的报文数量"
        length: 1
        type: bin
        ref_id: report_count
      - name: "应用层报文信息"
        type: repeat
        count_ref: report_count
        element:
          name: "第{index}条报文"
          fields:
            - name: "报文长度"
              length: 2
              type: bin
              ref_id: frame_length
            - name: 报文内容
              length_ref: frame_length
              type: hex

  - id: "E1800021"
    name: "测量点参数 MD5 校验码"
    protocol: "csg13"
    region: ["南网"]
    length: 16
    type: hex

  - id: "E1800023"
    name: "拓扑关系详细信息"
    protocol: "csg13"
    region: ["南网"]
    fields:
      - name: "总记录条数"
        length: 1
        type: bin
      - name: "本帧记录数"
        length: 1
        type: bin
        ref_id: node_count
      - name: "起始记录序号"
        length: 1
        type: bin
      - name: "节点信息"
        type: repeat
        count_ref: node_count
        element:
          name: "第{index}条节点信息"
          fields:
            - name: "节点地址"
              length: 6
              type: bcd
            - name: "子节点数量"
              length: 1
              type: bin
              ref_id: child_count
            - name: 子节点信息
              type: repeat
              count_ref: child_count
              element:
                name: "第{index}个子节点"
                length: 6
                type: hex
                endian: little
                format:
                  order: normal
                
