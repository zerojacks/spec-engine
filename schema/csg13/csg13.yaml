  - id: "E0000140"
    name: "终端复位"
    protocol: "csg13"
    region: ["南网"]
    length: 1
    type: bcd
    enum:
      "00": 所有可写参数恢复出厂设置（除通信参数外）
      "01": 数据区复位（清除历史数据）
      "02": 终端硬件复位
      "03": 清除表档案
      "04": 清除任务参数
      "05": 清除表端任务参数
      "06": 清除数据推送任务参数
      "07": 清除所有故障录波文件
      "08": 清除普通任务参数
      "09": 清除中继任务参数


  - id: "E1800001"
    name: "终端运行状态字"
    protocol: "csg13"
    region: ["南网"]
    length: 2
    fields:
      - name: "遥信状态"
        length: 1
        type: bitfield
        bits:
          - range: [0, 0]
            name: "计量柜门"
            enum:
              "1": "门开"
              "0": "门闭"
          - range: [1, 1]
            name: "端子盖"
            enum:
              "1": "门开"
              "0": "门闭"
          - range: [2, 2]
            name: "本体"
            enum:
              "1": "门开"
              "0": "门闭"
          - range: [3, 3]
            name: "第一轮开关"
            enum:
              "1": "门闭"
              "0": "门开"
          - range: [4, 4]
            name: "第二轮开关"
            enum:
              "1": "门闭"
              "0": "门开"
          - range: [5, 5]
            name: "第三轮开关"
            enum:
              "1": "门闭"
              "0": "门开"
          - range: [6, 6]
            name: "第四轮开关"
            enum:
              "1": "门闭"
              "0": "门开"
          - range: [7, 7]
            name: "保留"
      - name: "遥控状态"
        length: 1
        type: bitfield
        bits:
          - range: [0, 0]
            name: "电控"
            enum:
              "1": "投入"
              "0": "解除"
          - range: [1, 1]
            name: "功控"
            enum:
              "1": "投入"
              "0": "解除"
          - range: [2, 2]
            name: "遥控"
            enum:
              "1": "投入"
              "0": "解除"
          - range: [3, 3]
            name: "第一轮开关"
            enum:
              "1": "合"
              "0": "分"
          - range: [4, 4]
            name: "第二轮开关"
            enum:
              "1": "合"
              "0": "分"
          - range: [5, 5]
            name: "第三轮开关"
            enum:
              "1": "合"
              "0": "分"
          - range: [6, 6]
            name: "第四轮开关"
            enum:
              "1": "合"
              "0": "分"
          - range: [7, 7]
            name: "保电"
            enum:
              "1": "投入"
              "0": "解除"
