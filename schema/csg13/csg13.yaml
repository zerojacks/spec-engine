  - id: "E0000000"
    name: "全部进行确定/否定"
    protocol: "csg13"
    region: ["南网"]
    length: 1
    type: bcd
  - id: "E0001000"
    name: "表示终端登录"
    protocol: "csg13"
    region: ["南网"]
    type: container
    fields:
      - name: "规约版本号"
        length: 2
        type: bcd
      - name: "登录附加信息"     # 整个尾部是否存在，是第一层判断点
        type: switch
        on: "$remaining"
        cases:
          "0":
            type: container
            fields: []
          default:               # 只要还有剩余字节，就按新版结构继续解析
            type: container
            fields:
              - name: "是否具备安全模块"
                length: 1
                type: bcd
              - name: "终端时间"        # 终端时间本身是否存在，是第二层判断点
                type: switch
                on: "$remaining"
                cases:
                  "0":
                    type: container
                    fields: []
                  "6":
                    type: bcd
                    length: 6
                    time: "ssmmhhDDMMYY"

  - id: "E0001001"
    name: "表示终端心跳"
