templates:
  - id: IP_WITH_PORT
    protocol: csg13
    region: ["南网"]
    name: IP端口信息
    fields:
      - name: IP地址
        length: 4
        type: bin
        format:
          endian: little
          group_bytes: 1
          separator: "."
          pad: false
      - name: 端口号
        length: 2
        type: bin
        endian: big

  - id: APPINFO
    protocol: csg13
    region: ["南网"]
    name: APP信息
    fields:
      - name: APP名称
        length: 8
        type: ascii
      - name: APP版本号
        length: 8
        type: ascii
      - name: APP厂家代码
        length: 2
        type: ascii
      - name: APP CPU占用率
        length: 3
        type: bcd
        decimal: 2
        unit: "%"
      - name: APP CPU运行状态
        length: 1
        type: bcd
        enum:
          "01": 运行
          "02": 停止
          "03": 异常
      - name: APP虚拟内存大小
        length: 4
        type: bcd
        unit: kb
      - name: APP内存占用率
        length: 3
        type: bcd
        unit: "%"
      - name: APP复位次数
        length: 1
        type: bcd
        unit: 次

  - id: ARD1
    protocol: csg13
    region: ["南网"]
    name: ARD1
    fields:
      - name: 告警状态
        length: 1
        type: bcd
        enum:
          "00": 恢复
          "01": 发生
      - name: 告警发生时间
        length: 6
        type: bcd
        time: "ssmmhhDDMMYY"

  - id: ARD2
    protocol: csg13
    region: ["南网"]
    name: ARD2
    fields:
      - name: 告警状态
        length: 1
        type: bcd
        enum:
          "00": 恢复
          "01": 发生
      - name: 告警发生时间
        length: 6
        type: bcd
        time: "ssmmhhDDMMYY"
      - name: 发生时数据
        type: di_sequence
        items: [ "00010000", "00020000", "00030000", "00040000", "0201FF00", "0202FF00", "0203FF00", "0204FF00", "0206FF00" ]

  - id: ARD3
    protocol: csg13
    region: ["南网"]
    name: ARD3
    fields:
      - name: 告警状态
        length: 1
        type: bcd
        enum:
          "00": 恢复
          "01": 发生
      - name: 告警发生时间
        length: 6
        type: bcd
        time: "ssmmhhDDMMYY"
      - name: 发生前数据
        type: di_sequence
        items: [ "00010000", "00020000", "00030000", "00040000", "0201FF00", "0202FF00", "0203FF00", "0204FF00" ]
      - name: 发生后数据
        type: di_sequence
        items: [ "00010000", "00020000", "00030000", "00040000", "0201FF00", "0202FF00", "0203FF00", "0204FF00" ]

  - id: ARD4
    protocol: csg13
    region: ["南网"]
    name: ARD4
    fields:
      - name: 告警状态
        length: 1
        type: bcd
        enum:
          "00": 恢复
          "01": 发生
      - name: 告警发生时间
        length: 6
        type: bcd
        time: "ssmmhhDDMMYY"
      - name: 发生前数据
        type: di_sequence
        items: [ "00010000", "00020000", "00030000", "00040000", "E1000008" ]

  - id: ARD5
    protocol: csg13
    region: ["南网"]
    name: ARD5
    fields:
      - name: 告警状态
        length: 1
        type: bcd
        enum:
          "00": 恢复
          "01": 发生
      - name: 告警发生时间
        length: 6
        type: bcd
        time: "ssmmhhDDMMYY"
      - name: 发生前数据
