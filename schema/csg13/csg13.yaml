  - id: "E0000B00"
    name: "规约版本号"
    protocol: "csg13"
    region: ["南网"]
    length: 2
    type: hex
  - id: "E0000B01"
    name: "终端软件版本号"
    protocol: "csg13"
    region: ["南网"]
    length: 6
    fields:
      - name: "厂商编码"
        length: 2
        type: bin
        endian: little
      - name: "终端类型"
        length: 1
        type: bcd
      - name: "发布日期"
        length: 3
        type: bcd
        time: "DDMMYY"
  - id: "E0000B02"
    name: "终端硬件版本号"
    protocol: "csg13"
    region: ["南网"]
    length: 2
    type: hex
  - id: "E0000B03"
    name: "终端资产编号"
    protocol: "csg13"
    region: ["南网"]
    length: 24
    type: ascii
  - id: "E0000B04"
    name: "终端厂家信息"
    protocol: "csg13"
    region: ["南网"]
    length: 7
    fields:
      - name: "厂商代号"
        length: 4
        type: ascii
      - name: "生产日期"
        length: 3
        type: bcd
        time: "DDMMYY"
  - id: "E0000B05"
    name: "远程模块信息"
    protocol: "csg13"
    region: ["南网"]
    length: 32
    fields:
      - name: "厂商代号"
        length: 4
        type: ascii
      - name: "模块型号"
        length: 8
        type: ascii
      - name: "软件版本号"
        length: 4
        type: ascii
      - name: "软件发布日期"
        length: 6
        type: ascii
      - name: "硬件版本号"
        length: 4
        type: ascii
      - name: "硬件发布日期"
        length: 6
        type: ascii
  - id: "E0000B07"
    name: "是否具备安全模块"
    protocol: "csg13"
    region: ["南网"]
    length: 1
    type: bcd
  - id: "E0000B08"
    name: "功能模块信息"
    protocol: "csg13"
    region: ["南网"]
    type: repeat
    count: 5
    element:
      name: "第{index}个模块信息"
      type: template
      template_ref: MOUDLEINFO
      
  - id: "E0000B09"
    name: "终端以太网MAC地址"
    protocol: "csg13"
    region: ["南网"]
    fields:
      - name: "以太网接口数量"
        length: 1
        ref_id: eth_count
        type: bcd
      - name: "以太网接口MAC地址"
        type: repeat
        count_ref: eth_count
        element:
          type: hex
          length: 6
          order: normal
          format:
            group_bytes: 1
            separator: ":"
            pad: true

