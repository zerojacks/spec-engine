[workspace]
members = [
    "spec-compiler",
    "spec-engine",
    "spec-tools",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
license = "MIT"
repository = "https://github.com/yourusername/spec-engine"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
bincode = "1.3"
thiserror = "1.0"
